# ==============================================================================
# 文件: .github/workflows/backend-deploy.yml
# 用途: Spring Boot 后端 GitHub Action 流水线：登录ECR → 构建镜像 → 推送ECR → 部署EKS
# 流程: build镜像 → push到ECR → 用该镜像tag部署到EKS (三段式标准做法)
# 触发: 推送到 main(生产) 或其他分支时触发，多环境靠分支判断
# 架构说明：
#   dev/qa 共享同一个EKS集群，不同namespace
#   prod 使用独立EKS集群，独立namespace
#   使用Kustomize overlays管理多环境配置，和前端项目结构保持一致
# 流水线执行顺序：构建镜像 → dev自动部署(无需审批) → qa人工审批部署 → prod人工审批部署
# ==============================================================================
name: Backend Spring boot CI/CD Pipeline

# ---------- 触发条件 ----------
on:
  push:
    branches:
      - main          # main分支(生产)推送触发流水线
      - dev           # dev分支(开发)推送触发流水线
      - 'release/**'  # release分支(预发/qa)可选，按需开启
  workflow_dispatch:  # 支持手动在GitHub页面点"Run workflow"，手动触发流水线

# ---------- 权限(OIDC方式获取AWS临时凭证，推荐，比存长期AK安全) ----------
# id-token: write：用于OIDC联邦身份认证，获取临时AWS凭证
# contents: read：允许读取仓库代码，用于checkout检出代码
permissions:
  id-token: write
  contents: read

# ---------- 全局环境变量(可被各job内部的env覆盖) ----------
env:
  AWS_REGION: ap-southeast-1       # AWS区域，和EKS集群、ECR镜像仓库保持一致
  ECR_REPO: hy-demo-project        # ECR仓库名(去掉域名前缀)，👈替换为你的仓库名
  EKS_CLUSTER_DEV_QA: eks-demo     # dev、qa环境共用的EKS集群名称，👈替换
  EKS_CLUSTER_PROD: eks-prod       # prod生产环境独立EKS集群名称，👈替换
  ECR_REGISTRY: 168824777132.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com   # ECR镜像仓库完整域名地址

jobs:
  # Job1：构建镜像，只执行一次，后面所有环境复用这同一个镜像，保证多环境镜像一致性
  build-image:
    runs-on: ubuntu-latest   # 使用Ubuntu虚拟机作为流水线运行环境
    outputs:
      IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }} # 输出镜像tag，供下游部署job引用
    steps:
      # 1. 检出代码(必须，拉取当前仓库源码，用于构建后端镜像)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置镜像Tag，使用git commit完整sha作为镜像标签，便于代码版本追溯
      - name: Set Image Tag (commit sha)
        id: set-tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      # 3. 配置AWS临时凭证，基于OIDC联邦认证，无需在GitHub存储长期AK/SK
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168824777132:role/github-actions-eks  # 👈替换为你自己的OIDC IAM Role ARN
          aws-region: ${{ env.AWS_REGION }}

      # 4. 登录AWS ECR镜像仓库，后续才能推送构建好的docker镜像
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      # 5. 构建Docker镜像，Dockerfile路径 deploy/docker/Dockerfile
      # 镜像名称：ECR仓库地址 + 仓库名 + commit sha标签
      - name: Build Docker image
        env:
          TAG: ${{ github.sha }}
        run: |
          docker build -f deploy/docker/Dockerfile \
                       -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.TAG }} .

      # 6. 将构建完成的镜像推送到ECR镜像仓库保存
      - name: Push image to ECR
        env:
          TAG: ${{ github.sha }}
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.TAG }}

  # Job2：部署 dev 环境，自动执行，无需人工审批；依赖build-image构建成功才运行
  deploy-dev:
    needs: build-image
    runs-on: ubuntu-latest
    env:
      ENV_NAME: dev
      EKS_CLUSTER: ${{ env.EKS_CLUSTER_DEV_QA }} # dev环境使用dev/qa共享集群
      NAMESPACE: dev                            # dev环境使用独立namespace
      IMAGE_TAG: ${{ needs.build-image.outputs.IMAGE_TAG }} # 复用上游job输出的镜像tag
    steps:
      # 检出代码，读取kustomize配置文件（deploy/k8s/overlays）
      - name: Checkout
        uses: actions/checkout@v4

      # 配置AWS临时凭证，OIDC联邦认证
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168824777132:role/github-actions-eks
          aws-region: ${{ env.AWS_REGION }}

      # 更新kubeconfig，把当前runner的kubectl上下文切换到dev/qa集群
      - name: Update kubeconfig for dev/qa cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      # Kustomize渲染overlay配置，动态替换镜像名称，直接apply到k8s
      # --image backend-app=xxx：替换kustomize内backend-app占位镜像为ECR完整镜像地址
      - name: Deploy with Kustomize
        run: |
          kubectl kustomize deploy/k8s/overlays/${{ env.ENV_NAME }} \
          --image backend-app=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} \
          | kubectl apply -f -

      # 校验Deployment滚动更新是否成功，等待pod就绪，超时5分钟
      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/hy-demo-project -n ${{ env.NAMESPACE }} --timeout=300s

  # Job3：部署 qa 环境，必须人工审批，依赖dev部署成功后，才会进入等待审批状态
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa # GitHub仓库内提前创建qa环境，并开启Required reviewers人工审批
    env:
      ENV_NAME: qa
      EKS_CLUSTER: ${{ env.EKS_CLUSTER_DEV_QA }} # qa环境使用dev/qa共享集群
      NAMESPACE: qa                              # qa环境独立namespace
      IMAGE_TAG: ${{ needs.build-image.outputs.IMAGE_TAG }} # 复用上游job输出的镜像tag
    steps:
      # 检出代码，读取kustomize overlay配置
      - name: Checkout
        uses: actions/checkout@v4

      # 配置AWS临时OIDC凭证
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168824777132:role/github-actions-eks
          aws-region: ${{ env.AWS_REGION }}

      # 更新kubeconfig，切换kubectl上下文到dev/qa集群
      - name: Update kubeconfig for dev/qa cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      # Kustomize渲染qa overlay，替换镜像地址，部署到qa命名空间
      - name: Deploy with Kustomize
        run: |
          kubectl kustomize deploy/k8s/overlays/${{ env.ENV_NAME }} \
          --image backend-app=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} \
          | kubectl apply -f -

      # 等待Deployment滚动更新完成，校验pod就绪状态
      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/hy-demo-project -n ${{ env.NAMESPACE }} --timeout=300s

  # Job4：部署 prod 环境，人工审批，依赖qa部署成功后，进入等待审批状态
  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: prod # GitHub仓库内提前创建prod环境，并开启Required reviewers人工审批
    env:
      ENV_NAME: prod
      EKS_CLUSTER: ${{ env.EKS_CLUSTER_PROD }} # prod使用独立的生产EKS集群
      NAMESPACE: prod                          # prod独立namespace
      IMAGE_TAG: ${{ needs.build-image.outputs.IMAGE_TAG }} # 复用上游job输出的镜像tag
    steps:
      # 检出代码，读取kustomize overlay配置
      - name: Checkout
        uses: actions/checkout@v4

      # 配置AWS临时OIDC凭证
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168824777132:role/github-actions-eks
          aws-region: ${{ env.AWS_REGION }}

      # 更新kubeconfig，切换kubectl上下文到prod独立集群
      - name: Update kubeconfig for prod cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      # Kustomize渲染prod overlay，替换镜像地址，部署到prod集群prod命名空间
      - name: Deploy with Kustomize
        run: |
          kubectl kustomize deploy/k8s/overlays/${{ env.ENV_NAME }} \
          --image backend-app=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} \
          | kubectl apply -f -

      # 等待生产环境Deployment滚动更新完成，校验pod就绪状态
      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/hy-demo-project -n ${{ env.NAMESPACE }} --timeout=300s

# ==============================================================================
# 📝 备注
# 1. 多环境: main→prod, dev→dev, 通过分支判断给 ENV/DEPLOYMENT_REPLICAS 赋不同值
# 2. 配置文件已打包在jar内，deployment.yaml设置SPRING_PROFILES_ACTIVE=${ENV_NAME}，自动加载对应 application-{env}.yml
# 3. 镜像tag使用 ${github.sha}(commit hash)，可回溯到具体代码提交版本，方便排障与回滚
# 4. OIDC role权限要求：ECR读写权限 + 两个EKS集群(eks-demo、eks-prod)的kubectl操作权限，记得在AWS配置信任关系
# 5. 敏感配置(DB密码、密钥等)不要硬编码写在yaml，使用AWS SecretManager/ParameterStore，勿写明文到workflow或代码仓库
# 6. GitHub侧准备工作：仓库Settings -> Environments，手动创建qa、prod环境，开启审批人
# ==============================================================================