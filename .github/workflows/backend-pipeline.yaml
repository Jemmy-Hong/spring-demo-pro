# ==============================================================================
# 文件: .github/workflows/backend-deploy.yml
# 用途: Spring Boot 后端 GitHub Action 流水线：构建镜像 → 推送ECR → 部署EKS
# 流程: build镜像 → dev自动部署(无需审批) → qa人工审批部署 → prod人工审批部署
# 触发: 推送到 main(生产) / dev(开发)分支触发流水线，多环境靠分支判断
# 架构说明：
#   dev/qa 共享同一个EKS集群eks-demo，使用不同namespace做环境隔离
#   prod 使用独立EKS集群eks-prod，独立namespace
#   使用Kustomize overlays管理多环境配置，和前端项目目录结构保持一致
# ==============================================================================
name: Backend Spring boot CI/CD Pipeline

# ---------- 触发条件 ----------
on:
  push:
    branches:
      - main          # main分支(生产)推送触发流水线
      - dev           # dev分支(开发)推送触发流水线
  workflow_dispatch:  # 支持手动在GitHub页面点"Run workflow"，手动触发流水线

# ---------- 权限配置 ----------
permissions:
  contents: read     # 允许读取仓库代码，用于checkout检出代码

# ---------- 全局环境变量(固定静态字符串) ----------
env:
  AWS_REGION: ap-southeast-1       # AWS区域，和EKS集群、ECR镜像仓库保持一致
  ECR_REPO: hy-backend-repo     # ECR后端仓库名(去掉域名前缀)，👈替换为你的仓库名
  EKS_CLUSTER_DEV: eks-demo     # dev、qa环境共用的EKS集群名称，👈替换
  EKS_CLUSTER_QA: eks-demo      # dev、qa环境共用的EKS集群名称，👈替换
  EKS_CLUSTER_PROD: eks-prod    # prod生产环境独立EKS集群名称，👈替换
  NAMESPACE_DEV: dev
  NAMESPACE_QA: qa
  NAMESPACE_PROD: prod
  IMAGE_TAG: ${{ github.sha }} # 使用git commit sha作为镜像tag，便于追溯镜像版本

jobs:
  # Job1：构建镜像，只执行一次，后面所有环境复用这同一个镜像，保证多环境镜像一致性
  build:
    runs-on: ubuntu-latest   # 使用Ubuntu虚拟机作为流水线运行环境
    outputs:
      ECR_REGISTRY: ${{ steps.export-registry.outputs.ECR_REGISTRY }}
      IMAGE_TAG: ${{ env.IMAGE_TAG }}
    steps:
      # 1. 检出代码(必须，拉取当前仓库源码，用于构建后端Docker镜像)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置AWS凭证，当前采用AK/SK模式，和前端流水线保持统一；生产环境推荐OIDC联邦认证
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. 登录AWS ECR镜像仓库，使用官方action，和前端完全一致，自动获取registry地址
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. 提取ECR Registry地址，保存到output输出变量，传递给下游部署job使用
      - name: Export registry output
        id: export-registry
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

      # 5. 构建Docker镜像，基于deploy/docker目录下Dockerfile打包SpringBoot后端镜像
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f deploy/docker/Dockerfile \
                       -t $ECR_REGISTRY/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} .

      # 可选：Trivy漏洞扫描，后端业务镜像风险更高，推荐保留
      # 扫描CRITICAL/HIGH级别高危漏洞，发现高危漏洞直接终止流水线，不会推送镜像，安全左移
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # 6. 将构建完成的后端镜像推送到ECR镜像仓库保存，供EKS部署拉取
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}

  # Job2：部署 dev 环境，自动执行，无需人工审批；依赖build镜像构建成功才运行
  dev:
    needs: build
    # 条件：仅dev分支执行；workflow_dispatch手动触发时也允许执行
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev # github environment，dev环境不设置审批人，自动执行，和前端对齐
    env:
      ENV_NAME: dev
    steps:
      # 检出代码，读取kustomize多环境配置文件（deploy/k8s/overlays目录）
      - name: Checkout
        uses: actions/checkout@v4

      # 配置AWS AK/SK凭证，和build阶段保持一致，用于后续eks、ecr相关操作
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 更新kubeconfig，把当前github runner的kubectl上下文切换到dev/qa集群
      - name: Update kubeconfig for dev cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_DEV }} --region ${{ env.AWS_REGION }}

      # Kustomize渲染overlay多环境配置，动态替换镜像名称
      # --image backend-image=xxx : 将kustomize模板内backend-image占位镜像替换为ECR完整镜像地址
      # 仅内存渲染，不会修改仓库内yaml源码，避免git出现文件变更
      - name: Deploy with Kustomize
        env:
          ECR_REGISTRY: ${{ needs.build.outputs.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        run: |
          cd deploy/k8s/overlays/${ENV_NAME}
          trap 'git checkout kustomization.yaml' EXIT
          kustomize edit set image full_image_addr=${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
          kustomize build . | kubectl apply -f -

      # 校验Deployment滚动更新是否成功，等待所有pod就绪，超时时间5分钟
      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/hy-demo-project -n ${{ env.NAMESPACE_DEV }} --timeout=300s

  # Job3：部署 qa 环境，必须人工审批，依赖dev部署成功后，才会进入等待审批状态
  deploy-qa:
    needs: dev
    # 条件：仅dev分支执行；workflow_dispatch手动触发时也允许执行
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: qa # GitHub仓库内提前创建qa环境，并开启Required reviewers人工审批
    env:
      ENV_NAME: qa
    steps:
      # 检出代码，读取kustomize overlay配置
      - name: Checkout
        uses: actions/checkout@v4

      # 配置AWS AK/SK凭证，和前面job保持一致
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 更新kubeconfig，切换kubectl上下文到dev/qa集群
      - name: Update kubeconfig for qa cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_QA }} --region ${{ env.AWS_REGION }}

      # Kustomize渲染qa overlay，替换镜像地址，部署到qa命名空间
      - name: Deploy with Kustomize
        env:
          ECR_REGISTRY: ${{ needs.build.outputs.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        run: |
          cd deploy/k8s/overlays/${{ env.ENV_NAME }}
          kustomize edit set image backend-image=${ECR_REGISTRY}/${{ env.ECR_REPO }}:${IMAGE_TAG}
          kustomize build . | kubectl apply -f -
          # 回滚文件，恢复原始yaml，防止git检出的文件被修改
          git checkout kustomization.yaml

      # 等待Deployment滚动更新完成，校验pod就绪状态
      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/hy-demo-project -n ${{ env.NAMESPACE_QA }} --timeout=300s

  # Job4：部署 prod 环境，人工审批，依赖qa部署成功后，进入等待审批状态
  deploy-prod:
    needs: deploy-qa
    # 条件：仅main分支执行；workflow_dispatch手动触发时也允许执行
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod # GitHub仓库内提前创建prod环境，并开启Required reviewers人工审批
    env:
      ENV_NAME: prod
    steps:
      # 检出代码，读取kustomize overlay配置
      - name: Checkout
        uses: actions/checkout@v4

      # 配置AWS AK/SK凭证，和前面job保持一致
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 更新kubeconfig，切换kubectl上下文到prod独立集群
      - name: Update kubeconfig for prod cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_PROD }} --region ${{ env.AWS_REGION }}

      # Kustomize渲染prod overlay，替换镜像地址，部署到prod集群prod命名空间
      - name: Deploy with Kustomize
        env:
          ECR_REGISTRY: ${{ needs.build.outputs.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        run: |
          kubectl kustomize deploy/k8s/overlays/${{ env.ENV_NAME }} \
          --image backend-app=${ECR_REGISTRY}/${{ env.ECR_REPO }}:${IMAGE_TAG} \
          | kubectl apply -f -

      # 等待生产环境Deployment滚动更新完成，校验pod就绪状态
      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/hy-demo-project -n ${{ env.NAMESPACE_PROD }} --timeout=300s

# ==============================================================================
# 📝 备注
# 1. 多环境分支逻辑：dev分支执行 build → deploy-dev(自动) → deploy-qa(审批)；main分支只执行 build → deploy-prod(审批)
# 2. SpringBoot配置：deployment.yaml设置SPRING_PROFILES_ACTIVE=${ENV_NAME}，自动加载 application-{env}.yml
# 3. 镜像tag使用 ${github.sha}(commit hash)，可回溯到具体代码提交版本，方便排障与回滚
# 4. IAM权限要求：ECR读写权限 + 两个EKS集群(eks-demo、eks-prod)的kubectl操作权限
# 5. 敏感配置(DB密码、密钥等)不要硬编码写在yaml，使用AWS SecretManager/ParameterStore，禁止明文提交仓库
# 6. GitHub侧准备工作：仓库Settings -> Environments，手动创建dev、qa、prod环境；qa/prod开启审批人，dev不开启审批
# ==============================================================================