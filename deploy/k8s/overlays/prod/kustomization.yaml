# ==============================================================================
# 文件: overlays/prod/kustomization.yaml
# 用途：prod环境kustomize配置
# 继承base资源，**不创建Ingress**，后端仅集群内部访问，外部无法访问
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 继承base目录所有yaml资源(deployment + service)
resources:
  - ../../base

# 全局：所有资源自动加上namespace=prod
namespace: prod

# 覆盖Deployment副本数量
replicas:
  - name: hy-demo-project
    count: 3

# 全局给所有资源追加环境标签 environment: prod
labels:
  - includeTemplates: true
    pairs:
      environment: prod

# 引入补丁文件，修改Deployment容器内部配置
patches:
  - path: patch.yaml