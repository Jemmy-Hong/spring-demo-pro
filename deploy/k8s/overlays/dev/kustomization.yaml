# ==============================================================================
# 文件: overlays/dev/kustomization.yaml
# 用途：dev环境kustomize配置
# 继承base资源，引入dev独有的Ingress，设置namespace、副本数、全局标签、部署补丁
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 继承base目录所有yaml资源(deployment + service)
resources:
  - ../../base
  - ingress.yaml

# 全局：所有资源自动加上namespace=dev
namespace: dev

# 覆盖Deployment副本数量
replicas:
  - name: hy-demo-project
    count: 1

# 全局给所有资源追加环境标签 environment: dev
labels:
  - includeTemplates: true
    pairs:
      environment: dev

# 引入补丁文件，修改Deployment容器内部配置（环境变量、JVM、资源限制）
patches:
  - path: patch.yaml

images:
  - name: backend-image
    newName: full_image_addr