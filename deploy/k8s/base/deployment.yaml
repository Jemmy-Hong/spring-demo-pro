#        imagePullPolicy: Always
#        env:
#        - name: FLUENTD_ARGS
#          value: -c /fluentd/etc/fluent.conf
#        resources: { requests:{cpu:200m,memory:256Mi}, limits:{cpu:300m,memory:384Mi} }
#        volumeMounts:
#        - mountPath: /fluentd/etc
#          name: config-volume
#        - name: app-logs
#          mountPath: /data/logs
#   d. 注意: Sidecar模式每pod一个fluentd，扩缩容随之增减采集器，资源开销大，
#      且需额外维护configMap。新项目优先 DaemonSet(Fluent-Bit)，不推荐sidecar。
